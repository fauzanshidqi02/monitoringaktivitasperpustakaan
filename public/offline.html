<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Offline - Monitoring Aktivitas Perpustakaan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 12% 20%, rgba(15,118,110,0.18), transparent 28%),
                radial-gradient(circle at 88% 18%, rgba(37,99,235,0.16), transparent 30%),
                linear-gradient(135deg, #f0fdfa 0%, #eff6ff 55%, #ffffff 100%);
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .offline-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(255,255,255,0.95);
            border-radius: 28px;
            padding: 34px;
            text-align: center;
            box-shadow: 0 25px 65px rgba(15,23,42,0.14);
            backdrop-filter: blur(14px);
        }

        .wifi-scene {
            height: 210px;
            position: relative;
            margin-bottom: 18px;
        }

        .human {
            position: absolute;
            left: 50%;
            bottom: 15px;
            width: 170px;
            height: 170px;
            transform: translateX(-50%);
            animation: floatHuman 3s ease-in-out infinite;
        }

        @keyframes floatHuman {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }

        .head {
            position: absolute;
            left: 56px;
            top: 15px;
            width: 58px;
            height: 58px;
            background: #ffd7b5;
            border-radius: 50%;
            z-index: 3;
        }

        .hair {
            position: absolute;
            left: 53px;
            top: 5px;
            width: 64px;
            height: 36px;
            background: #111827;
            border-radius: 50px 50px 18px 18px;
            z-index: 4;
        }

        .eye {
            position: absolute;
            top: 41px;
            width: 6px;
            height: 6px;
            background: #111827;
            border-radius: 50%;
            z-index: 5;
        }

        .eye.left {
            left: 74px;
        }

        .eye.right {
            left: 96px;
        }

        .mouth {
            position: absolute;
            left: 78px;
            top: 58px;
            width: 20px;
            height: 10px;
            border-bottom: 3px solid #111827;
            border-radius: 0 0 30px 30px;
            z-index: 5;
        }

        .body {
            position: absolute;
            left: 38px;
            top: 84px;
            width: 94px;
            height: 74px;
            background: #ffffff;
            border-radius: 28px 28px 14px 14px;
            box-shadow: 0 10px 22px rgba(15,23,42,0.14);
            z-index: 2;
        }

        .body::before {
            content: "";
            position: absolute;
            left: 27px;
            bottom: 0;
            width: 40px;
            height: 52px;
            background: #0f766e;
            border-radius: 20px 20px 12px 12px;
        }

        .wifi {
            position: absolute;
            left: 50%;
            top: 4px;
            width: 130px;
            height: 95px;
            transform: translateX(-50%);
        }

        .wifi span {
            position: absolute;
            left: 50%;
            border: 7px solid transparent;
            border-top-color: #2563eb;
            border-radius: 50%;
            transform: translateX(-50%);
            opacity: .3;
            animation: pulseWifi 1.8s ease-in-out infinite;
        }

        .wifi span:nth-child(1) {
            width: 120px;
            height: 120px;
            top: 0;
        }

        .wifi span:nth-child(2) {
            width: 86px;
            height: 86px;
            top: 20px;
            animation-delay: .2s;
        }

        .wifi span:nth-child(3) {
            width: 52px;
            height: 52px;
            top: 40px;
            animation-delay: .4s;
        }

        .wifi-dot {
            position: absolute;
            left: 50%;
            top: 83px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ef4444;
            transform: translateX(-50%);
            animation: pulseDot 1s ease-in-out infinite;
        }

        @keyframes pulseWifi {
            0%, 100% {
                opacity: .18;
            }

            50% {
                opacity: .65;
            }
        }

        @keyframes pulseDot {
            0%, 100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.22);
            }
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
            color: #0f172a;
        }

        p {
            margin: 0 0 24px;
            color: #64748b;
            line-height: 1.7;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: #0f766e;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
        }

        .btn:hover {
            background: #0d665f;
        }

        .footer {
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }

        .footer strong {
            color: #0f766e;
        }
    </style>
</head>
<body>

<div class="offline-card">
    <div class="wifi-scene">
        <div class="wifi">
            <span></span>
            <span></span>
            <span></span>
            <div class="wifi-dot"></div>
        </div>

        <div class="human">
            <div class="hair"></div>
            <div class="head"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
            <div class="body"></div>
        </div>
    </div>

    <h1>Koneksi belum tersambung</h1>

    <p>
        Sepertinya jaringan atau server sedang tidak bisa dijangkau.
        Coba cek koneksi, lalu refresh halaman ini.
    </p>

    <button type="button" class="btn" onclick="window.location.reload()">
        🔄 Coba Lagi
    </button>

    <div class="footer">
        © 2026 by <strong>Rumah Literasi</strong>
    </div>
</div>

<script>
    window.addEventListener('online', function () {
        window.location.reload();
    });
</script>

</body>
</html>
